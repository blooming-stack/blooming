name: Blooming login hotfix
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/fix-login.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login, logout and cloud password safety
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""const save=()=>{saveLocalOnly();if(CLOUD_ON)cloudSync();};"""
          new="""const save=()=>{saveLocalOnly();if(CLOUD_ON&&S.currentAccountId)cloudSync();};"""
          s=s.replace(old,new)
          old="""const accounts=Object.values(S.accounts||{}).filter(a=>a&&a.id).map(a=>({id:a.id,nome:a.nome||'Conta',pw_hash:a.pw||''}));\n  if(accounts.length){const r=await SB.from('blooming_accounts').upsert(accounts,{onConflict:'id'});if(r.error)throw r.error}"""
          new="""const accounts=Object.values(S.accounts||{}).filter(a=>a&&a.id&&String(a.pw||'')).map(a=>({id:a.id,nome:a.nome||'Conta',pw_hash:String(a.pw)}));\n  if(accounts.length){const r=await SB.from('blooming_accounts').upsert(accounts,{onConflict:'id'});if(r.error)throw r.error}"""
          s=s.replace(old,new)
          old="""if(m==='o'){UNL=false;accessMode='';S.me=null;S.currentAccountId=null;$('#md').close();$('#app').innerHTML='';R()}"""
          new="""if(m==='o'){UNL=false;accessMode='';S.me=null;S.currentAccountId=null;try{$('#md').close()}catch(_){}saveLocalOnly();login();return}"""
          s=s.replace(old,new)
          start=s.find("if(a==='li'){")
          end=s.find("\n if(a==='vv')", start)
          if start<0 or end<0: raise SystemExit('login block not found')
          block=r'''if(a==='li'){
  const nameEl=$('#lu'),codeEl=$('#lp'),errEl=$('#le');
  const n=String(nameEl?.value||'').trim(), raw=String(codeEl?.value||''), h=pwh(raw), nl=n.toLowerCase();
  if(!n||!raw){if(errEl)errEl.textContent='Informe seu nome e seu código de acesso.';return}
  const button=document.querySelector('[data-a="li"]');if(button){button.disabled=true;button.textContent='Entrando…'}
  try{
    if(nl==='ana laura'&&h===ANA_ACCESS_HASH){accessMode='ana';UNL=true;S.currentAccountId='ana';S.me=null;saveLocalOnly();unlockScreen(true);return}
    const ag=S.accessGroups&&S.accessGroups.alana;
    if(nl==='alana aquino'&&ag&&ag.h){if(h===ag.h){accessMode='alana';UNL=true;S.currentAccountId='alana';S.me=null;saveLocalOnly();unlockScreen(true);maybeTutorial()}else if(errEl)errEl.textContent='Nome ou código incorretos.';return}
    if(CLOUD_ON&&SB){try{const q=await SB.from('blooming_accounts').select('id,nome').ilike('nome',n).eq('pw_hash',h).limit(1);if(q.error)throw q.error;const data0=Array.isArray(q.data)?q.data[0]:null;if(data0){S.accounts=S.accounts||{};const old=S.accounts[data0.id]||{};S.accounts[data0.id]={...old,id:data0.id,nome:data0.nome||old.nome||n,pw:h,profiles:Array.isArray(old.profiles)?old.profiles:[],legacy:!!old.legacy};S.currentAccountId=data0.id;S.me=null;accessMode='normal';UNL=true;saveLocalOnly();unlockScreen(true);maybeTutorial();setTimeout(()=>cloudPull(),350);return}}catch(err){console.warn('login Supabase:',err)}}
    const acc=Object.values(S.accounts||{}).find(x=>String(x.nome||'').trim().toLowerCase()===nl&&String(x.pw||'')===h);
    if(acc){accessMode='normal';S.currentAccountId=acc.id;S.me=null;UNL=true;saveLocalOnly();unlockScreen(true);maybeTutorial();if(CLOUD_ON)setTimeout(()=>cloudPull(),350)}
    else if(errEl)errEl.textContent='Nome ou código incorretos. Se ainda não tiver conta, use “Criar código”.';
  }finally{if(button&&document.body.contains(button)){button.disabled=false;button.textContent='Entrar'}}
}'''
          s=s[:start]+block+s[end:]
          p.write_text(s,encoding='utf-8')
          if 'if(CLOUD_ON&&S.currentAccountId)cloudSync' not in s: raise SystemExit('save patch failed')
          if "saveLocalOnly();login();return" not in s: raise SystemExit('logout patch failed')
          if "if(a==='li'){" not in s: raise SystemExit('login patch failed')
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No changes needed"; exit 0; fi
          git commit -m "Fix Blooming login logout and cloud account sync"
          git push
