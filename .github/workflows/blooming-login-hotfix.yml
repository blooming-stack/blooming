name: Blooming login hotfix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply login and recovery hotfix
        env:
          PATCH_B64: |
            PGJsb29taW5nIGxvZ2luIGhvdGZpeCBwYXRjaCBjb250ZW50IHdpbGwgYmUgaW5qZWN0ZWQgYmVsb3cK
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- BLOOMING LOGIN HOTFIX 2026-10-05 -->'
          if marker in s:
              print('Hotfix already present; nothing to do.')
              raise SystemExit(0)
          patch=base64.b64decode('''"+enc+''').decode('utf-8')
          p.write_text(s+'\n'+patch+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Blooming login and forgot-code flow'
          git push
