name: Deploy Blooming to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Blooming runtime configuration
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.BLOOMING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude '_site' --exclude '.git' --exclude '.github' ./ _site/
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo 'ERROR: GitHub Actions secret BLOOMING_SUPABASE_PUBLISHABLE_KEY is missing.'
            echo 'Create it in Settings > Secrets and variables > Actions > New repository secret.'
            exit 1
          fi
          if [[ "$SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo 'ERROR: BLOOMING_SUPABASE_PUBLISHABLE_KEY does not contain a Supabase publishable key.'
            echo 'Replace the repository secret with the current sb_publishable_... key from Supabase.'
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import os, json
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          url='https://eulxkpxjwhwknegvhjsv.supabase.co'
          key=os.environ['SUPABASE_PUBLISHABLE_KEY']
          payload=json.dumps({'url':url,'key':key},separators=(',',':'))
          boot='<script>localStorage.setItem("blooming:v08:supabase",'+json.dumps(payload)+' );</script>'
          s=s.replace('<script>',boot+'<script>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
