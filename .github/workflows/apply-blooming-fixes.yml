name: Apply Blooming fixes

on:
  push:
    paths-ignore:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply safe incremental patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- BLOOMING_SAFE_PATCH_V2 -->'
          if marker in s:
              print('Patch already present')
              raise SystemExit(0)

          favicon = '<link rel="icon" type="image/svg+xml" href="./blooming-logo.svg">'
          script = '<script defer src="./blooming-fixes.js?v=2"></script>'
          if '</head>' not in s:
              raise SystemExit('No </head> found; refusing to modify index.html')
          s = s.replace('</head>', favicon + script + marker + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          print('index.html patched')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Apply Blooming incremental UI fixes [skip ci]'
          git push
