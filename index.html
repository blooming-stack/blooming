<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Blooming</title><style>
:root{--bg:#f7f4f8;--card:#fff;--ink:#17131a;--mut:#746c78;--line:#e5dfe7;--accent:#e83370}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.app{min-height:100vh;display:grid;place-items:center;padding:20px}.card,.home{width:min(920px,100%);background:var(--card);border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:0 18px 60px #25152d12}.card{width:min(520px,100%)}.brand{font-size:38px;font-weight:900;letter-spacing:-1.5px}.sub{color:var(--mut)}label{font-size:14px;font-weight:700}.field{display:grid;gap:7px;margin:14px 0}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer}.primary,.secondary,.pill{border-radius:13px;padding:12px 16px;font-weight:800}.primary{width:100%;border:0;background:var(--accent);color:#fff}.secondary,.pill{border:1px solid var(--line);background:transparent}.secondary{width:100%;margin-top:10px}.link{display:block;width:100%;border:0;background:none;color:var(--accent);font-weight:800;margin-top:16px}.msg{min-height:22px;margin-top:12px;font-size:14px;color:#b42318}.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px;margin-top:28px}.profile{border:0;background:none;text-align:center;color:inherit}.avatar{width:120px;height:120px;border-radius:18px;margin:auto;display:grid;place-items:center;font-size:48px;color:#fff;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.profile b{display:block;margin-top:10px}.profile small{color:var(--mut)}.add{border:2px dashed var(--line);background:transparent;color:var(--mut)}.panel{margin-top:24px;border-top:1px solid var(--line);padding-top:22px}.cover{height:180px;border-radius:18px;background:var(--line);background-size:cover;background-position:center;margin-bottom:-55px}.profileLarge{padding:0 18px}.profileLarge .avatar{position:relative;border:5px solid var(--card);width:130px;height:130px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.preview{width:100%;max-height:180px;object-fit:cover;border-radius:14px;margin-top:8px}.back{margin-bottom:16px}@media(max-width:560px){.app{padding:10px}.card,.home{padding:20px;border-radius:20px}.profiles{grid-template-columns:repeat(2,1fr)}.avatar{width:100px;height:100px}.cover{height:140px}}
</style></head><body><div id="app" class="app"></div><script>
(()=>{'use strict';const KEY='blooming:v03:session',CFG='blooming:v03:supabase',BUCKET='blooming-media';const st={db:null,account:null,profiles:[],profile:null};const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const cfg=()=>{try{return JSON.parse(localStorage.getItem(CFG)||'null')}catch{return null}};const sess=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}};const setSess=x=>localStorage.setItem(KEY,JSON.stringify(x));const clear=()=>localStorage.removeItem(KEY);
function supabase(){let c=cfg();if(!c?.url||!c?.key||!window.supabase?.createClient)return false;st.db=window.supabase.createClient(c.url,c.key);return true}
function config(){app.innerHTML=`<section class="card"><div class="brand">Blooming</div><p class="sub">Configuração inicial do Supabase</p><div class="field"><label>Project URL</label><input id="url" placeholder="https://seu-projeto.supabase.co"></div><div class="field"><label>Publishable / anon key</label><input id="key"></div><button class="primary" id="save">Salvar configuração</button><div id="msg" class="msg"></div></section>`;$('#save').onclick=()=>{let u=$('#url').value.trim(),k=$('#key').value.trim();if(!u||!k){msg.textContent='Preencha os dois campos.';return}localStorage.setItem(CFG,JSON.stringify({url:u,key:k}));location.reload()}}
async function hash(v){let h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function login(){app.innerHTML=`<section class="card"><div class="brand">Blooming</div><p class="sub">Entre na sua conta</p><form id="f"><div class="field"><label>Nome da conta</label><input id="name" autocomplete="username" required></div><div class="field"><label>Código de acesso</label><input id="code" type="password" required></div><button class="primary">Entrar</button><div id="msg" class="msg"></div></form><button class="link" id="forgot">Esqueci meu código</button><button class="secondary" id="new">Criar acesso</button></section>`;$('#f').onsubmit=async e=>{e.preventDefault();if(!supabase()){msg.textContent='Configure o Supabase antes de entrar.';return}let n=$('#name').value.trim(),h=await hash($('#code').value),r=await st.db.from('blooming_access').select('id,display_name').eq('name_key',n.toLowerCase()).eq('code_hash',h).maybeSingle();if(r.error||!r.data){msg.textContent='Nome da conta ou código incorreto.';return}st.account=r.data;setSess({accountId:r.data.id});await loadProfiles()};$('#new').onclick=create;$('#forgot').onclick=()=>alert('A recuperação será configurada em uma etapa própria.')}
function create(){app.innerHTML=`<section class="card"><div class="brand">Blooming</div><p class="sub">Crie seu acesso</p><form id="f"><div class="field"><label>Nome da conta</label><input id="name" maxlength="80" required></div><div class="field"><label>Código</label><input id="code" type="password" minlength="4" maxlength="32" required></div><div class="field"><label>Confirme o código</label><input id="code2" type="password" minlength="4" maxlength="32" required></div><button class="primary">Criar acesso</button><div id="msg" class="msg"></div></form><button class="link" id="back">Voltar</button></section>`;$('#back').onclick=login;$('#f').onsubmit=async e=>{e.preventDefault();if(!supabase()){msg.textContent='Configure o Supabase antes de criar o acesso.';return}let n=$('#name').value.trim(),a=$('#code').value,b=$('#code2').value;if(a!==b){msg.textContent='Os códigos não são iguais.';return}let r=await st.db.from('blooming_access').insert({display_name:n,name_key:n.toLowerCase(),code_hash:await hash(a)}).select('id,display_name').single();if(r.error){msg.textContent=r.error.code==='23505'?'Esse nome já está em uso.':r.error.message;return}st.account=r.data;setSess({accountId:r.data.id});await loadProfiles()}}
async function loadProfiles(){let r=await st.db.from('blooming_profiles').select('*').eq('account_id',st.account.id).order('created_at');if(r.error){alert(r.error.message);return}st.profiles=r.data||[];picker()}
function picker(){app.innerHTML=`<section class="home"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="brand">Blooming</div><p class="sub">Quem está usando?</p></div><button class="pill" id="logout">Sair</button></div><div class="profiles">${st.profiles.map(p=>`<button class="profile" data-id="${p.id}"><div class="avatar" style="background:${esc(p.color)}">${p.avatar_url?`<img src="${esc(p.avatar_url)}">`:esc(p.emoji||'🌷')}</div><b>${esc(p.display_name)}</b><small>@${esc(p.username)}</small></button>`).join('')}<button class="profile" id="add"><div class="avatar add">＋</div><b>+ criar perfil</b></button></div></section>`;document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{st.profile=st.profiles.find(p=>p.id===b.dataset.id);profileHome()});$('#add').onclick=profileForm;$('#logout').onclick=()=>{clear();st.account=null;login()}}
function profileHome(){let p=st.profile;app.innerHTML=`<section class="home"><div style="display:flex;justify-content:space-between;gap:12px"><div><div class="brand">@${esc(p.username)}</div><p class="sub">Perfil selecionado</p></div><div><button class="pill" id="switch">Trocar perfil</button> <button class="pill" id="logout">Sair</button></div></div><div class="panel"><div class="cover" style="background-image:url('${esc(p.cover_url||'')}')"></div><div class="profileLarge"><div class="avatar" style="background:${esc(p.color)}">${p.avatar_url?`<img src="${esc(p.avatar_url)}">`:esc(p.emoji||'🌷')}</div><h2>${esc(p.display_name)}</h2><p>${esc(p.bio)||'Sem bio.'}</p><button class="primary" id="edit">Editar perfil</button></div></div></section>`;$('#switch').onclick=picker;$('#logout').onclick=()=>{clear();login()};$('#edit').onclick=()=>profileForm(p)}
async function upload(file,kind){if(!file||!st.account||!st.profile)return null;if(!['image/jpeg','image/png','image/webp','image/gif'].includes(file.type)){throw Error('Use JPG, PNG, WEBP ou GIF.')}if(file.size>8*1024*1024)throw Error('A imagem deve ter no máximo 8 MB.');let ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`${st.account.id}/${st.profile?.id||'new'}/${kind}-${crypto.randomUUID()}.${ext}`;let r=await st.db.storage.from(BUCKET).upload(path,file,{upsert:true,contentType:file.type});if(r.error)throw r.error;return st.db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl}
function profileForm(p=null){let x=p||{display_name:'',username:'',bio:'',color:'#E83370',emoji:'🌷',avatar_url:'',cover_url:''};app.innerHTML=`<section class="card"><button class="pill back" id="back">← Voltar</button><div class="brand">${p?'Editar perfil':'Criar perfil'}</div><p class="sub">${p?'Altere os dados do perfil.':'Crie seu perfil.'}</p><div class="field"><label>Nome</label><input id="name" value="${esc(x.display_name)}"></div><div class="field"><label>@username</label><input id="user" value="${esc(x.username)}" placeholder="ex: nalau"></div><div class="field"><label>Bio</label><textarea id="bio" rows="3">${esc(x.bio)}</textarea></div><div class="grid"><div class="field"><label>Cor</label><input id="color" type="color" value="${esc(x.color)}"></div><div class="field"><label>Emoji</label><input id="emoji" maxlength="4" value="${esc(x.emoji)}"></div></div><div class="field"><label>Foto de perfil</label><input id="avatarFile" type="file" accept="image/*"><img id="avatarPreview" class="preview" ${x.avatar_url?`src="${esc(x.avatar_url)}"`:''}></div><div class="field"><label>Foto de capa</label><input id="coverFile" type="file" accept="image/*"><img id="coverPreview" class="preview" ${x.cover_url?`src="${esc(x.cover_url)}"`:''}></div><button class="primary" id="save">Salvar perfil</button><div id="msg" class="msg"></div></section>`;$('#back').onclick=()=>p?profileHome():picker();$('#avatarFile').onchange=e=>{let f=e.target.files[0];if(f)$('#avatarPreview').src=URL.createObjectURL(f)};$('#coverFile').onchange=e=>{let f=e.target.files[0];if(f)$('#coverPreview').src=URL.createObjectURL(f)};$('#save').onclick=async()=>{let name=$('#name').value.trim(),u=$('#user').value.trim().replace(/^@/,'').toLowerCase();if(!name||!u){msg.textContent='Nome e username são obrigatórios.';return}let body={display_name:name,username:u,bio:$('#bio').value.trim(),color:$('#color').value,emoji:$('#emoji').value.trim()||'🌷',account_id:st.account.id,avatar_url:x.avatar_url||null,cover_url:x.cover_url||null};try{if($('#avatarFile').files[0])body.avatar_url=await upload($('#avatarFile').files[0],'avatar');if($('#coverFile').files[0])body.cover_url=await upload($('#coverFile').files[0],'cover')}catch(e){msg.textContent=e.message;return}let r=p?await st.db.from('blooming_profiles').update(body).eq('id',p.id).eq('account_id',st.account.id):await st.db.from('blooming_profiles').insert(body);if(r.error){msg.textContent=r.error.code==='23505'?'Esse @username já está em uso.':r.error.message;return}await loadProfiles();if(p){st.profile=st.profiles.find(q=>q.id===p.id);profileHome()}}}
async function boot(){if(!cfg()){config();return}if(!supabase()){config();return}let s=sess();if(s?.accountId){let r=await st.db.from('blooming_access').select('id,display_name').eq('id',s.accountId).maybeSingle();if(r.data){st.account=r.data;await loadProfiles();return}clear()}login()}
let sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';sc.onload=boot;sc.onerror=()=>app.innerHTML='<section class="card"><div class="brand">Blooming</div><p>Não foi possível carregar o Supabase.</p></section>';document.head.appendChild(sc)
})();</script></body></html>
