<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blooming</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#111;--line:#292929;--text:#f5f5f5;--muted:#999;--accent:#d38cff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;line-height:1.1}
.auth-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 0%, rgba(211,140,255,0.15) 0%, transparent 60%)}
.auth-box{width:100%;max-width:400px;padding:32px;background:var(--card);border-radius:24px;border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,0.2)}
.auth-logo{text-align:center;font-size:3rem;margin-bottom:8px}
.auth-title{text-align:center;font-size:2.2rem;font-weight:800;margin-bottom:24px;letter-spacing:-0.02em}
.field{text-align:left;margin-bottom:16px}
.field label{display:block;font-size:0.85rem;font-weight:700;color:var(--muted);margin-bottom:6px;margin-left:4px}
.field input{width:100%;padding:14px 16px;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:1rem}
.field input:focus{outline:none;border-color:var(--accent)}
.btn-primary{width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#160d1b;font-weight:800;font-size:1rem;margin-top:8px;cursor:pointer}
.btn-secondary{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--text);font-weight:700;font-size:1rem;margin-top:10px;cursor:pointer}
.auth-switch{text-align:center;margin-top:20px;font-size:0.9rem;color:var(--muted)}
.auth-switch a{color:var(--accent);text-decoration:none;font-weight:700;cursor:pointer}
.layout{max-width:1250px;margin:auto;min-height:100vh;display:grid;grid-template-columns:245px minmax(0,650px) 300px}
.sidebar{border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh}
.brand{font-size:25px;font-weight:900;padding:10px 12px 20px}
.nav{width:100%;display:flex;gap:12px;padding:12px;border:0;background:transparent;color:var(--text);border-radius:12px;text-align:left;cursor:pointer}
.nav:hover{background:var(--card)}
.main{border-right:1px solid var(--line)}
.top{position:sticky;top:0;z-index:5;padding:15px 18px;background:var(--bg);border-bottom:1px solid var(--line);font-weight:800}
.post,.composer{display:flex;gap:12px;padding:16px;border-bottom:1px solid var(--line)}
.grow{flex:1}
.avatar{width:44px;height:44px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--accent);color:#160d1b;flex:none;font-weight:900}
.composer textarea{width:100%;min-height:70px;background:transparent;border:0;color:var(--text);resize:none;outline:0;font-size:1.1rem}
.posttext{white-space:pre-wrap;overflow-wrap:anywhere;margin:7px 0}
.muted{color:var(--muted)}
.primary{background:var(--accent);border:0;border-radius:999px;padding:11px 18px;font-weight:800;color:#160d1b;cursor:pointer}
.secondary{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:10px 15px;cursor:pointer}
@media(max-width:950px){.layout{grid-template-columns:72px minmax(0,650px)}.sidebar span,.right{display:none}}
@media(max-width:700px){.layout{display:block}.sidebar{display:none}.main{border:0}}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// CONFIGURAÇÃO DO SEU NOVO SUPABASE
const URL_SUPABASE="https://jzetzelxstyfzrjfnill.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6ZXR6ZWx4c3R5ZnpyamZuaWxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4ODQ3NjUsImV4cCI6MjEwODQ2MDc2NX0.x3ZmG-S1hluuLCqJHWHMo6oL8Iyjk2P_CQIsNFnggcA";
const db=supabase.createClient(URL_SUPABASE,KEY);

let S={user:null,profile:null,page:"home"};
const $=x=>document.querySelector(x);

async function checkSession(){
  const {data:{session}}=await db.auth.getSession();
  if(session){
    S.user=session.user;
    await loadProfile();
  } else {
    renderLogin();
  }
}

function renderLogin(){
  $("#app").innerHTML=`
    <div class="auth-screen">
      <div class="auth-box">
        <div class="auth-logo">🌸</div>
        <h1 class="auth-title">Blooming</h1>
        <form onsubmit="doLogin(event)">
          <div class="field"><label>E-mail</label><input id="email" type="email" required></div>
          <div class="field"><label>Senha</label><input id="pass" type="password" required></div>
          <button type="submit" class="btn-primary">Entrar</button>
        </form>
        <div class="auth-switch">
          Não tem conta? <a onclick="renderRegister()">Cadastre-se</a>
        </div>
      </div>
    </div>`;
}

function renderRegister(){
  $("#app").innerHTML=`
    <div class="auth-screen">
      <div class="auth-box">
        <div class="auth-logo">🌸</div>
        <h1 class="auth-title">Criar Conta</h1>
        <form onsubmit="doRegister(event)">
          <div class="field"><label>Nome</label><input id="name" required></div>
          <div class="field"><label>@ Usuário</label><input id="user" required></div>
          <div class="field"><label>E-mail</label><input id="email" type="email" required></div>
          <div class="field"><label>Senha</label><input id="pass" type="password" required></div>
          <button type="submit" class="btn-primary">Criar Conta</button>
        </form>
        <div class="auth-switch">
          Já tem conta? <a onclick="renderLogin()">Entrar</a>
        </div>
      </div>
    </div>`;
}

async function doLogin(e){
  e.preventDefault();
  const email=$("#email").value;
  const pass=$("#pass").value;
  
  const {data, error}=await db.auth.signInWithPassword({email, password:pass});
  if(error) return alert(error.message);
  
  S.user=data.user;
  await loadProfile();
}

async function doRegister(e){
  e.preventDefault();
  const name=$("#name").value;
  const user=$("#user").value.replace(/^@/,"");
  const email=$("#email").value;
  const pass=$("#pass").value;
  
  // 1. Cria o usuário no Auth
  const {data, error}=await db.auth.signUp({email, password:pass});
  if(error) return alert(error.message);
  
  // 2. Cria o perfil
  const {error:profileError}=await db.from("blooming_profiles").insert([{
    id: data.user.id,
    nome: name,
    username: user
  }]);
  
  if(profileError) return alert(profileError.message);
  
  S.user=data.user;
  await loadProfile();
}

async function loadProfile(){
  const {data, error}=await db.from("blooming_profiles").select("*").eq("id",S.user.id).single();
  if(error || !data) {
    // Se o usuário logou mas não tem perfil (ex: erro no cadastro)
    return alert("Perfil não encontrado. Tente se cadastrar novamente.");
  }
  S.profile=data;
  renderApp();
}

function renderApp(){
  $("#app").innerHTML=`
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">🌸 <span>Blooming</span></div>
        <button class="nav" onclick="go('home')"><b>⌂</b> <span>Início</span></button>
        <button class="nav" onclick="logout()" style="margin-top:auto"><b>↪</b> <span>Sair</span></button>
      </aside>
      <main class="main">
        <div class="top">Início</div>
        <div class="composer">
          <div class="avatar">${S.profile.emoji}</div>
          <div class="grow">
            <textarea id="postText" placeholder="O que está florescendo?"></textarea>
            <button class="primary" onclick="publish()">Publicar</button>
          </div>
        </div>
        <div id="feed"></div>
      </main>
    </div>`;
  loadFeed();
}

async function loadFeed(){
  const {data, error}=await db.from("blooming_posts").select("*, blooming_profiles(username, nome, emoji)").order("created_at",{ascending:false});
  
  if(error) return $("#feed").innerHTML=`<p class="muted" style="padding:16px">${error.message}</p>`;
  
  $("#feed").innerHTML=data.map(p=>`
    <div class="post">
      <div class="avatar">${p.blooming_profiles?.emoji || '🌸'}</div>
      <div class="grow">
        <b>${p.blooming_profiles?.nome || 'Usuário'}</b> <span class="muted">@${p.blooming_profiles?.username}</span>
        <div class="posttext">${p.text}</div>
      </div>
    </div>
  `).join("") || `<p class="muted" style="padding:16px">Nenhum post ainda.</p>`;
}

async function publish(){
  const text=$("#postText").value;
  if(!text.trim()) return;
  
  const {error}=await db.from("blooming_posts").insert([{user_id: S.user.id, text}]);
  if(error) return alert(error.message);
  
  $("#postText").value="";
  loadFeed();
}

function go(p){ if(p==='home') loadFeed(); }

function logout(){
  db.auth.signOut();
  S.user=null; S.profile=null;
  renderLogin();
}

checkSession();
</script>
</body>
</html>
