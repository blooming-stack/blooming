<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blooming</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F3FB;--card:#fff;--ink:#1B1526;--mut:#6B6280;--line:#E4DEF0;--acc:#E8336F;--on:#fff;box-sizing:border-box}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif}h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif}.mut{color:var(--mut)}button,input,textarea{font:inherit}.b{border:0;border-radius:999px;background:var(--acc);color:var(--on);font-weight:700;padding:10px 20px;cursor:pointer}.b.g{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.fi{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);margin:4px 0 12px}.av{border-radius:50%;display:grid;place-items:center;overflow:hidden;background:var(--acc);color:#fff;flex:none}.sh{display:grid;grid-template-columns:260px minmax(0,600px);justify-content:center;min-height:100vh}.nv{position:sticky;top:0;height:100vh;padding:20px 16px;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--line)}.nv a,.nv button.l{display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:999px;background:none;border:0;cursor:pointer;text-align:left;color:inherit;text-decoration:none}.nv a:hover,.nv button.l:hover{background:var(--card)}main{border-right:1px solid var(--line);min-height:100vh;padding-bottom:60px}.tp{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line);padding:16px 20px;font-weight:800}.cp,.po{display:flex;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line)}.cp textarea{width:100%;border:0;background:none;resize:none;font-size:1.1rem;outline:0;min-height:50px}.po .bd{min-width:0;flex:1}.tx{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0}.ac{display:flex;gap:20px;margin-top:12px;color:var(--mut)}.ac button{background:none;border:0;cursor:pointer;color:inherit}.lo{max-width:420px;margin:auto;padding:60px 20px;text-align:center}.profile-grid{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;margin:32px 0}.profile-card{text-align:center;cursor:pointer}.check-open{position:fixed;right:18px;bottom:18px;z-index:9999;border:0;border-radius:999px;background:var(--acc);color:#fff;padding:12px 18px;font-weight:800;box-shadow:0 8px 24px #0003;cursor:pointer}.check-modal{position:fixed;inset:0;background:#0008;z-index:10000;display:none;align-items:center;justify-content:center;padding:18px}.check-modal.open{display:flex}.check-box{width:min(760px,96vw);max-height:90vh;overflow:auto;background:var(--card);color:var(--ink);border-radius:24px;padding:24px;box-shadow:0 20px 60px #0006}.check-head{display:flex;justify-content:space-between;gap:15px;align-items:center}.check-close{border:0;background:none;font-size:28px;cursor:pointer}.check-progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.check-progress i{display:block;height:100%;width:0;background:var(--acc);transition:.2s}.check-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.check-cat{border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}.check-cat h3{margin:0 0 8px}.check-item{display:flex;align-items:flex-start;gap:10px;padding:7px 2px;cursor:pointer}.check-item input{width:18px;height:18px;accent-color:var(--acc);margin-top:3px}.check-item.done span{text-decoration:line-through;opacity:.55}@media(max-width:700px){.sh{display:block}.nv{position:fixed;bottom:0;width:100%;height:auto;flex-direction:row;justify-content:space-around;border:0;border-top:1px solid var(--line);z-index:10;background:var(--card);padding:8px}.nv span{display:none}.nv a,.nv button.l{padding:12px}.check-open{bottom:72px;right:12px}main{border:0}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="md"></dialog>
<button class="check-open" onclick="BloomingChecklist.open()">✓ Checklist Blooming</button>
<div id="checkModal" class="check-modal" onclick="if(event.target===this)BloomingChecklist.close()"><section class="check-box"><div class="check-head"><div><h2>🌸 Checklist Blooming</h2><p id="checkCount" class="mut">0 de 18 concluídos</p></div><button class="check-close" onclick="BloomingChecklist.close()">×</button></div><div class="check-progress"><i id="checkBar"></i></div><div class="check-actions"><button class="b" onclick="BloomingChecklist.all()">Marcar tudo</button><button class="b g" onclick="BloomingChecklist.clear()">Limpar</button></div><div id="checkList"></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://eulxkpxjwhwknegvhjsv.supabase.co';
const SUPABASE_KEY=localStorage.getItem('blooming:v08:supabase_key')||localStorage.getItem('blooming_supabase_key')||'';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let S={me:null,accountId:null,profiles:{},posts:[]};const $=s=>document.querySelector(s);
const checklist=[['Conta e acesso',['Login','Criar conta','Esqueci meu código','Alterar código','Recuperação','Manter conectado','Encerrar sessões','Excluir acesso']],['Perfis',['Criar perfil','Excluir perfil','Trocar perfil','Perfil estilo Netflix','Foto e capa','Editar perfil','Usuário único','Perfis Oficiais 1/2']],['Persistência Supabase',['Contas','Perfis','Publicações','Curtidas','Comentários','Seguidores','Mensagens','Exclusões permanentes','Sincronização celular/computador']],['Feed',['Publicar','Fotos','Vídeos','Links','Curtir','Comentar','Fixar publicação','Excluir/editar publicação','Menu de ações']],['Seguindo / Para você',['Abas','Feed personalizado','Ordem das publicações','Contagem de seguidores']],['Busca e descoberta',['Buscar perfis','Buscar hashtags','Tendências orgânicas','Perfis verificados','Perfis privados']],['Seguir',['Seguir','Deixar de seguir','Solicitação privada','Aceitar/recusar','Ano da solicitação']],['Notificações',['Novos seguidores','Solicitações','Curtidas','Comentários']],['Mensagens',['Conversas','Excluir mensagem','Limpar conversa','Excluir conversa','Sincronização']],['Mídia no chat',['Fotos','Vídeos','Áudios','Stickers','GIFs','Crop','Duração de vídeo','Salvar stickers']],['Comunidades',['Criar comunidade','Entrar','Convites','Membros','Publicações']],['Importação do X',['Posts','Fotos','Vídeos','Links','Data original','Deduplicação','Seguidores','Vídeos /video/1','Overlay estilo X']],['Links inteligentes',['Spotify','Wattpad','Livros','Filmes','Letterboxd','Tipo de conteúdo','Artista/autor/ano']],['Configurações',['Tema','Preto verdadeiro / Mudo Escuro','Cor personalizada','Gerenciar perfis','Segurança','Backup','Dispositivos']],['Mobile / desktop',['Layout responsivo','Barra inferior no celular','Navegação desktop','Rolagem da página inteira','Upload de mídia']],['Segurança',['Sessões','Código de acesso','Privacidade','Contas privadas','Exclusão definitiva']],['Backup',['Backup automático','Recuperação','Preservar alterações','Evitar perda de dados']],['Limpeza',['Remover contas de teste','Remover posts de teste','Remover chats duplicados','Não recriar dados excluídos']]];
const CK='blooming:v08:checklist';let checked=JSON.parse(localStorage.getItem(CK)||'{}');
function renderChecklist(){let n=0,total=0,h='';checklist.forEach((c,ci)=>{h+=`<div class="check-cat"><h3>${ci+1}. ${c[0]}</h3>`;c[1].forEach((x,ii)=>{let k=ci+'-'+ii,v=!!checked[k];if(v)n++;total++;h+=`<label class="check-item ${v?'done':''}"><input type="checkbox" ${v?'checked':''} onchange="BloomingChecklist.toggle('${k}',this.checked)"><span>${x}</span></label>`});h+='</div>'});$('#checkList').innerHTML=h;$('#checkCount').textContent=`${n} de ${total} concluídos`;$('#checkBar').style.width=(n/total*100)+'%'}
window.BloomingChecklist={open(){renderChecklist();$('#checkModal').classList.add('open')},close(){$('#checkModal').classList.remove('open')},toggle(k,v){checked[k]=v;localStorage.setItem(CK,JSON.stringify(checked));renderChecklist()},all(){checklist.forEach((c,ci)=>c[1].forEach((_,ii)=>checked[ci+'-'+ii]=true));localStorage.setItem(CK,JSON.stringify(checked));renderChecklist()},clear(){checked={};localStorage.setItem(CK,'{}');renderChecklist()}};
const IC={home:'⌂',user:'♙',logout:'↪'};
function renderLogin(){$('#app').innerHTML=`<div class="lo"><h1>🌸 Blooming</h1><p class="mut">Entre na sua conta ou crie uma nova.</p><div style="text-align:left"><label>Nome da conta</label><input class="fi" id="loginName" placeholder="Nome da conta"><label>Código de acesso</label><input class="fi" id="loginPass" type="password" placeholder="Código"></div><button class="b" style="width:100%" onclick="doLogin()">Entrar</button><button class="b g" style="width:100%;margin-top:10px" onclick="doSignup()">Criar nova conta</button><p id="loginError" style="color:var(--acc)"></p></div>`}
async function doLogin(){const name=$('#loginName').value.trim(),pass=$('#loginPass').value.trim();if(!name||!pass)return $('#loginError').textContent='Preencha nome e código.';$('#loginError').textContent='Entrando...';const {data,error}=await sb.from('blooming_accounts').select('*').ilike('nome',name).eq('pw_hash',pass).single();if(error||!data)return $('#loginError').textContent='Nome ou código incorretos.';S.accountId=data.id;localStorage.setItem('blooming_account',data.id);localStorage.removeItem('blooming_me');await loadProfiles()}
async function doSignup(){const name=$('#loginName').value.trim(),pass=$('#loginPass').value.trim();if(!name||!pass)return $('#loginError').textContent='Preencha nome e código.';const id='a'+Date.now();const {data,error}=await sb.from('blooming_accounts').insert([{id,nome:name,pw_hash:pass}]).select().single();if(error)return $('#loginError').textContent='Erro: '+error.message;S.accountId=data.id;localStorage.setItem('blooming_account',data.id);await loadProfiles()}
async function loadProfiles(){$('#app').innerHTML='<div class="lo"><p>Carregando perfis...</p></div>';const {data,error}=await sb.from('blooming_profiles').select('*').eq('account_id',S.accountId);if(error)return alert('Erro: '+error.message);S.profiles={};(data||[]).forEach(p=>S.profiles[p.id]=p);renderProfilePicker()}
function renderProfilePicker(){let h='<div class="lo"><h1>Quem está usando?</h1><div class="profile-grid">';Object.values(S.profiles).forEach(p=>h+=`<div class="profile-card" onclick="selectProfile('${p.id}')"><div class="av" style="width:96px;height:96px;font-size:2rem;margin:auto">${p.emo||'🌸'}</div><b>${p.nome}</b><div class="mut">@${p.username||''}</div></div>`);h+=`<div class="profile-card" onclick="createNewProfile()"><div class="av" style="width:96px;height:96px;font-size:2rem;margin:auto;background:transparent;color:var(--mut);border:2px dashed var(--line)">+</div><b>Criar perfil</b></div></div><button class="b g" onclick="logout()">Sair da conta</button></div>`;$('#app').innerHTML=h}
async function createNewProfile(){const nome=prompt('Nome do novo perfil:');if(!nome)return;const username=prompt('Nome de usuário (sem @):');if(!username)return;const id='u'+Date.now();const {error}=await sb.from('blooming_profiles').insert([{id,account_id:S.accountId,nome,username,bio:'Novo por aqui!',cor:'#E8336F',emo:'🌸'}]);if(error)return alert('Erro: '+error.message);loadProfiles()}
async function selectProfile(id){S.me=S.profiles[id];localStorage.setItem('blooming_me',id);localStorage.setItem('blooming_account',S.accountId);renderApp()}
function logout(){localStorage.removeItem('blooming_me');localStorage.removeItem('blooming_account');S={me:null,accountId:null,profiles:{},posts:[]};renderLogin()}
async function renderApp(){$('#app').innerHTML=`<div class="sh"><nav class="nv"><h2>🌸 Blooming</h2><a href="#" onclick="renderFeed();return false">${IC.home}<span>Início</span></a><a href="#" onclick="editProfile();return false">${IC.user}<span>Perfil</span></a><button class="l" onclick="logout()">${IC.logout}<span>Sair</span></button></nav><main><div class="tp">Início</div><div class="cp"><div class="av" style="width:42px;height:42px">${S.me.emo||'🌸'}</div><div style="flex:1"><textarea id="postText" placeholder="O que está florescendo?"></textarea><button class="b" onclick="createPost()">Publicar</button></div></div><div id="feed"></div></main></div>`;renderFeed()}
async function renderFeed(){const {data}=await sb.from('blooming_posts').select('*').order('created_at',{ascending:false});$('#feed').innerHTML=(data||[]).map(p=>`<div class="po"><div class="av" style="width:42px;height:42px">🌸</div><div class="bd"><b>${p.user_id||''}</b><div class="tx">${p.text||''}</div><div class="ac">♡ ${p.likes_count||0}　💬</div></div></div>`).join('')||'<div class="po"><span class="mut">Nenhuma publicação ainda.</span></div>'}
async function createPost(){const text=$('#postText').value.trim();if(!text)return;const {error}=await sb.from('blooming_posts').insert([{id:'p'+Date.now(),user_id:S.me.username,text}]);if(error)return alert('Erro: '+error.message);$('#postText').value='';renderFeed()}
function editProfile(){const p=S.me;$('#md').showModal();$('#md').innerHTML=`<h2>Editar Perfil</h2><input class="fi" id="editName" value="${p.nome||''}"><textarea class="fi" id="editBio" rows="3">${p.bio||''}</textarea><button class="b g" onclick="$('#md').close()">Cancelar</button> <button class="b" onclick="saveProfile()">Salvar</button>`}
async function saveProfile(){const nome=$('#editName').value,bio=$('#editBio').value;const {error}=await sb.from('blooming_profiles').update({nome,bio,updated_at:new Date().toISOString()}).eq('id',S.me.id);if(error)return alert('Erro: '+error.message);S.me.nome=nome;S.me.bio=bio;$('#md').close();renderApp()}
function init(){const p=localStorage.getItem('blooming_me'),a=localStorage.getItem('blooming_account');if(p&&a){S.accountId=a;sb.from('blooming_profiles').select('*').eq('id',p).single().then(({data})=>data?(S.me=data,renderApp()):renderLogin())}else renderLogin()}
Object.assign(window,{doLogin,doSignup,createNewProfile,selectProfile,logout,editProfile,saveProfile,renderFeed,createPost});init();
</script>
<script src="blooming_checklist.js"></script>
</body></html>
