<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blooming</title><style>
:root{--bg:#f7f4f8;--card:#fff;--ink:#17131a;--mut:#746c78;--line:#e5dfe7;--accent:#e83370}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.app{min-height:100vh;padding:20px}.card,.home{width:min(920px,100%);margin:auto;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:0 18px 60px #25152d12}.card{max-width:520px}.brand{font-size:38px;font-weight:900;letter-spacing:-1.5px}.sub{color:var(--mut)}label{font-size:14px;font-weight:700}.field{display:grid;gap:7px;margin:14px 0}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer}.primary,.secondary,.pill{border-radius:13px;padding:12px 16px;font-weight:800}.primary{width:100%;border:0;background:var(--accent);color:#fff}.secondary,.pill{border:1px solid var(--line);background:transparent}.secondary{width:100%;margin-top:10px}.link{display:block;width:100%;border:0;background:none;color:var(--accent);font-weight:800;margin-top:16px}.msg{min-height:22px;margin-top:12px;font-size:14px;color:#b42318}.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px;margin-top:28px}.profile{border:0;background:none;text-align:center;color:inherit}.avatar{width:120px;height:120px;border-radius:18px;margin:auto;display:grid;place-items:center;font-size:48px;color:#fff;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.profile b{display:block;margin-top:10px}.profile small{color:var(--mut)}.add{border:2px dashed var(--line);background:transparent;color:var(--mut)}.panel{margin-top:24px;border-top:1px solid var(--line);padding-top:22px}.cover{height:220px;border-radius:18px;background:var(--line);background-size:cover;background-position:center;margin-bottom:-55px}.profileLarge{padding:0 18px}.profileLarge .avatar{position:relative;border:5px solid var(--card);width:130px;height:130px}.stats{display:flex;gap:28px;margin:18px 0}.stat{text-align:center}.stat strong{display:block;font-size:21px}.stat span{font-size:13px;color:var(--mut)}.posts{margin-top:26px;border-top:1px solid var(--line);padding-top:22px}.post{border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:18px;background:var(--card)}.postHead{padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}.author{display:flex;align-items:center;gap:10px}.authorAvatar{width:42px;height:42px;border-radius:50%;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:800}.authorAvatar img{width:100%;height:100%;object-fit:cover}.postMedia{width:100%;max-height:620px;display:block;object-fit:contain;background:#111}.postBody{padding:15px 16px}.postDate{font-size:12px;color:var(--mut);margin-top:8px}.empty{border:1px dashed var(--line);border-radius:16px;padding:30px;text-align:center;color:var(--mut)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.preview{width:100%;max-height:180px;object-fit:cover;border-radius:14px;margin-top:8px}.back{margin-bottom:16px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.nav .pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}.feed{max-width:760px}.feedHead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.feedPost{margin-top:18px}.caption{white-space:pre-wrap;word-break:break-word}.danger{color:#b42318;border-color:#f0b8b2}@media(max-width:560px){.app{padding:10px}.card,.home{padding:20px;border-radius:20px}.profiles{grid-template-columns:repeat(2,1fr)}.avatar{width:100px;height:100px}.cover{height:150px}.stats{gap:18px}.postMedia{max-height:430px}}
</style></head><body><div id="app" class="app"></div><script>
(()=>{'use strict';const KEY='blooming:v06:session',CFG='blooming:v06:supabase',BUCKET='blooming-media';const st={db:null,account:null,profiles:[],profile:null,posts:[]};const $=s=>document.querySelector(s);const app=document.getElementById('app');const msg=()=>document.getElementById('msg');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const cfg=()=>{try{return JSON.parse(localStorage.getItem(CFG)||'null')}catch{return null}};const sess=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}};const setSess=x=>localStorage.setItem(KEY,JSON.stringify(x));const clear=()=>localStorage.removeItem(KEY);
function supabase(){let c=cfg();if(!c?.url||!c?.key||!window.supabase?.createClient)return false;st.db=window.supabase.createClient(c.url,c.key);return true}
function config(){app.innerHTML=`<section class="card"><div class="brand">Blooming</div><p class="sub">Configuração inicial do Supabase</p><div class="field"><label>Project URL</label><input id="url" placeholder="https://seu-projeto.supabase.co"></div><div class="field"><label>Publishable / anon key</label><input id="key"></div><button class="primary" id="save">Salvar configuração</button><div id="msg" class="msg"></div></section>`;$('#save').onclick=()=>{let u=$('#url').value.trim(),k=$('#key').value.trim();if(!u||!k){msg().textContent='Preencha os dois campos.';return}localStorage.setItem(CFG,JSON.stringify({url:u,key:k}));location.reload()}}
async function hash(v){let h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function login(){app.innerHTML=`<section class="card"><div class="brand">Blooming</div><p class="sub">Entre na sua conta</p><form id="f"><div class="field"><label>Nome da conta</label><input id="name" autocomplete="username" required></div><div class="field"><label>Código de acesso</label><input id="code" type="password" required></div><button class="primary">Entrar</button><div id="msg" class="msg"></div></form><button class="link" id="forgot">Esqueci meu código</button><button class="secondary" id="new">Criar acesso</button></section>`;$('#f').onsubmit=async e=>{e.preventDefault();if(!supabase()){msg().textContent='Configure o Supabase antes de entrar.';return}let n=$('#name').value.trim(),h=await hash($('#code').value),r=await st.db.from('blooming_access').select('id,display_name').eq('name_key',n.toLowerCase()).eq('code_hash',h).maybeSingle();if(r.error||!r.data){msg().textContent='Nome da conta ou código incorreto.';return}st.account=r.data;setSess({accountId:r.data.id});await loadProfiles()};$('#new').onclick=create;$('#forgot').onclick=()=>alert('A recuperação será configurada em uma etapa própria.')}
function create(){app.innerHTML=`<section class="card"><div class="brand">Blooming</div><p class="sub">Crie seu acesso</p><form id="f"><div class="field"><label>Nome da conta</label><input id="name" maxlength="80" required></div><div class="field"><label>Código</label><input id="code" type="password" minlength="4" maxlength="32" required></div><div class="field"><label>Confirme o código</label><input id="code2" type="password" minlength="4" maxlength="32" required></div><button class="primary">Criar acesso</button><div id="msg" class="msg"></div></form><button class="link" id="back">Voltar</button></section>`;$('#back').onclick=login;$('#f').onsubmit=async e=>{e.preventDefault();if(!supabase()){msg().textContent='Configure o Supabase antes de criar o acesso.';return}let n=$('#name').value.trim(),a=$('#code').value,b=$('#code2').value;if(a!==b){msg().textContent='Os códigos não são iguais.';return}let r=await st.db.from('blooming_access').insert({display_name:n,name_key:n.toLowerCase(),code_hash:await hash(a)}).select('id,display_name').single();if(r.error){msg().textContent=r.error.code==='23505'?'Esse nome já está em uso.':r.error.message;return}st.account=r.data;setSess({accountId:r.data.id});await loadProfiles()}}
async function loadProfiles(){let r=await st.db.from('blooming_profiles').select('*').eq('account_id',st.account.id).order('created_at');if(r.error){alert(r.error.message);return}st.profiles=r.data||[];picker()}
function picker(){app.innerHTML=`<section class="home"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="brand">Blooming</div><p class="sub">Quem está usando?</p></div><button class="pill" id="logout">Sair</button></div><div class="profiles">${st.profiles.map(p=>`<button class="profile" data-id="${p.id}"><div class="avatar" style="background:${esc(p.color)}">${p.avatar_url?`<img src="${esc(p.avatar_url)}">`:esc(p.emoji||'🌷')}</div><b>${esc(p.display_name)}</b><small>@${esc(p.username)}</small></button>`).join('')}<button class="profile" id="add"><div class="avatar add">＋</div><b>+ criar perfil</b></button></div></section>`;document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{st.profile=st.profiles.find(p=>p.id===b.dataset.id);profileHome()});$('#add').onclick=profileForm;$('#logout').onclick=()=>{clear();st.account=null;st.profile=null;login()}}
async function stats(p){let [followers,following,posts]=await Promise.all([st.db.from('blooming_follows').select('id',{count:'exact',head:true}).eq('following_profile_id',p.id),st.db.from('blooming_follows').select('id',{count:'exact',head:true}).eq('follower_profile_id',p.id),st.db.from('blooming_posts').select('id',{count:'exact',head:true}).eq('profile_id',p.id)]);return {followers:followers.count||0,following:following.count||0,posts:posts.count||0}}
async function loadPosts(){let r=await st.db.from('blooming_posts').select('*').eq('profile_id',st.profile.id).order('created_at',{ascending:false});if(r.error){st.posts=[];return}st.posts=r.data||[]}
function postCard(p,profile=st.profile,own=false){let media=p.media_url?(p.media_type==='video'?`<video class="postMedia" src="${esc(p.media_url)}" controls playsinline></video>`:`<img class="postMedia" src="${esc(p.media_url)}" alt="Publicação">`):'';return `<article class="post"><div class="postHead"><div class="author"><div class="authorAvatar" style="background:${esc(profile?.color||'#e83370')}">${profile?.avatar_url?`<img src="${esc(profile.avatar_url)}">`:esc(profile?.emoji||'🌷')}</div><div><strong>@${esc(profile?.username||'perfil')}</strong><div class="postDate">${new Date(p.created_at).toLocaleString('pt-BR')}</div></div></div>${own?`<button class="pill danger" data-delete-post="${p.id}">Excluir</button>`:''}</div>${media}<div class="postBody">${p.caption?`<div class="caption">${esc(p.caption)}</div>`:''}</div></article>`}
async function renderPosts(){await loadPosts();let box=$('#postList');if(box)box.innerHTML=st.posts.length?st.posts.map(p=>postCard(p,st.profile,true)).join(''):`<div class="empty">Ainda não há publicações.</div>`;document.querySelectorAll('[data-delete-post]').forEach(b=>b.onclick=()=>deletePost(b.dataset.deletePost))}
async function deletePost(id){if(!confirm('Excluir esta publicação?'))return;let r=await st.db.from('blooming_posts').delete().eq('id',id).eq('profile_id',st.profile.id);if(r.error){alert(r.error.message);return}await profileHome()}
function nav(active){return `<div class="nav"><button class="pill ${active==='profile'?'active':''}" id="navProfile">Perfil</button><button class="pill ${active==='feed'?'active':''}" id="navFeed">Para você</button><button class="pill" id="navSwitch">Trocar perfil</button><button class="pill" id="navLogout">Sair</button></div>`}
async function profileHome(){let p=st.profile;app.innerHTML=`<section class="home"><div><div class="brand">@${esc(p.username)}</div><p class="sub">Perfil selecionado</p>${nav('profile')}</div><div class="panel"><div class="cover" style="background-image:url('${esc(p.cover_url||'')}')"></div><div class="profileLarge"><div class="avatar" style="background:${esc(p.color)}">${p.avatar_url?`<img src="${esc(p.avatar_url)}">`:esc(p.emoji||'🌷')}</div><h2>${esc(p.display_name)}</h2><p>${esc(p.bio)||'Sem bio.'}</p><div class="stats"><div class="stat"><strong id="followers">—</strong><span>seguidores</span></div><div class="stat"><strong id="following">—</strong><span>seguindo</span></div><div class="stat"><strong id="postCount">—</strong><span>publicações</span></div></div><button class="primary" id="edit">Editar perfil</button><div class="posts"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h3>Publicações</h3><button class="pill" id="newPost">＋ Nova publicação</button></div><div id="postList"><div class="empty">Carregando...</div></div></div></div></div></section>`;bindNav();$('#edit').onclick=()=>profileForm(p);$('#newPost').onclick=postForm;let s=await stats(p);$('#followers').textContent=s.followers;$('#following').textContent=s.following;$('#postCount').textContent=s.posts;await renderPosts()}
function bindNav(){$('#navProfile')?.addEventListener('click',profileHome);$('#navFeed')?.addEventListener('click',feed);$('#navSwitch')?.addEventListener('click',picker);$('#navLogout')?.addEventListener('click',()=>{clear();st.account=null;st.profile=null;login()})}
async function upload(file,kind,profileId){if(!file||!st.account)return null;let ok=kind==='post'?(file.type.startsWith('image/')||file.type.startsWith('video/')):['image/jpeg','image/png','image/webp','image/gif'].includes(file.type);if(!ok)throw Error(kind==='post'?'Use uma imagem ou vídeo.':'Use JPG, PNG, WEBP ou GIF.');let limit=kind==='post'?50*1024*1024:8*1024*1024;if(file.size>limit)throw Error(`O arquivo deve ter no máximo ${kind==='post'?'50':'8'} MB.`);let ext=(file.name.split('.').pop()||'bin').toLowerCase(),path=`${st.account.id}/${profileId}/${kind}-${crypto.randomUUID()}.${ext}`;let r=await st.db.storage.from(BUCKET).upload(path,file,{upsert:true,contentType:file.type});if(r.error)throw r.error;return st.db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl}
function postForm(){app.innerHTML=`<section class="card"><button class="pill back" id="back">← Voltar</button><div class="brand">Nova publicação</div><p class="sub">Publique como @${esc(st.profile.username)}</p><div class="field"><label>Foto ou vídeo</label><input id="media" type="file" accept="image/*,video/*"><div id="mediaPreview"></div></div><div class="field"><label>Legenda</label><textarea id="caption" rows="5" maxlength="5000" placeholder="Escreva uma legenda..."></textarea></div><button class="primary" id="publish">Publicar</button><div id="msg" class="msg"></div></section>`;$('#back').onclick=profileHome;$('#media').onchange=()=>{let f=$('#media').files[0];if(!f)return;let u=URL.createObjectURL(f);$('#mediaPreview').innerHTML=f.type.startsWith('video/')?`<video class="preview" src="${u}" controls></video>`:`<img class="preview" src="${u}">`};$('#publish').onclick=async()=>{let f=$('#media').files[0],caption=$('#caption').value.trim();if(!f&&!caption){msg().textContent='Adicione uma foto/vídeo ou escreva uma legenda.';return}$('#publish').disabled=true;try{let mediaUrl=f?await upload(f,'post',st.profile.id):null,mediaType=f?(f.type.startsWith('video/')?'video':'image'):null,r=await st.db.from('blooming_posts').insert({profile_id:st.profile.id,caption,media_url:mediaUrl,media_type:mediaType});if(r.error)throw r.error;profileHome()}catch(e){msg().textContent=e.message;$('#publish').disabled=false}}}
function profileForm(p=null){let x=p||{display_name:'',username:'',bio:'',color:'#E83370',emoji:'🌷',avatar_url:'',cover_url:''},uploadProfileId=p?.id||crypto.randomUUID();app.innerHTML=`<section class="card"><button class="pill back" id="back">← Voltar</button><div class="brand">${p?'Editar perfil':'Criar perfil'}</div><p class="sub">${p?'Altere os dados do perfil.':'Crie seu perfil.'}</p><div class="field"><label>Nome</label><input id="name" value="${esc(x.display_name)}"></div><div class="field"><label>@username</label><input id="user" value="${esc(x.username)}" placeholder="ex: nalau"></div><div class="field"><label>Bio</label><textarea id="bio" rows="3">${esc(x.bio)}</textarea></div><div class="grid"><div class="field"><label>Cor</label><input id="color" type="color" value="${esc(x.color)}"></div><div class="field"><label>Emoji</label><input id="emoji" maxlength="4" value="${esc(x.emoji)}"></div></div><div class="field"><label>Foto de perfil</label><input id="avatarFile" type="file" accept="image/*"><img id="avatarPreview" class="preview" ${x.avatar_url?`src="${esc(x.avatar_url)}"`:''}></div><div class="field"><label>Foto de capa</label><input id="coverFile" type="file" accept="image/*"><img id="coverPreview" class="preview" ${x.cover_url?`src="${esc(x.cover_url)}"`:''}></div><button class="primary" id="save">Salvar perfil</button><div id="msg" class="msg"></div></section>`;$('#back').onclick=()=>p?profileHome():picker();$('#avatarFile').onchange=e=>{let f=e.target.files[0];if(f)$('#avatarPreview').src=URL.createObjectURL(f)};$('#coverFile').onchange=e=>{let f=e.target.files[0];if(f)$('#coverPreview').src=URL.createObjectURL(f)};$('#save').onclick=async()=>{let name=$('#name').value.trim(),u=$('#user').value.trim().replace(/^@/,'').toLowerCase();if(!name||!u){msg().textContent='Nome e username são obrigatórios.';return}let body={display_name:name,username:u,bio:$('#bio').value.trim(),color:$('#color').value,emoji:$('#emoji').value.trim()||'🌷',account_id:st.account.id,avatar_url:x.avatar_url||null,cover_url:x.cover_url||null};try{if($('#avatarFile').files[0])body.avatar_url=await upload($('#avatarFile').files[0],'avatar',uploadProfileId);if($('#coverFile').files[0])body.cover_url=await upload($('#coverFile').files[0],'cover',uploadProfileId)}catch(e){msg().textContent=e.message;return}let r=p?await st.db.from('blooming_profiles').update(body).eq('id',p.id).eq('account_id',st.account.id):await st.db.from('blooming_profiles').insert({...body,id:uploadProfileId});if(r.error){msg().textContent=r.error.code==='23505'?'Esse @username já está em uso.':r.error.message;return}await loadProfiles();if(p){st.profile=st.profiles.find(q=>q.id===p.id);profileHome()}}}
async function feed(){app.innerHTML=`<section class="home feed"><div class="feedHead"><div><div class="brand">Para você</div><p class="sub">Publicações mais recentes do Blooming</p></div></div>${nav('feed')}<div id="feedList"><div class="empty">Carregando...</div></div></section>`;bindNav();let r=await st.db.from('blooming_posts').select('*').order('created_at',{ascending:false}).limit(50);if(r.error){$('#feedList').innerHTML=`<div class="empty">Não foi possível carregar o feed: ${esc(r.error.message)}</div>`;return}let posts=r.data||[],ids=[...new Set(posts.map(p=>p.profile_id))],profiles={};if(ids.length){let pr=await st.db.from('blooming_profiles').select('*').in('id',ids);(pr.data||[]).forEach(p=>profiles[p.id]=p)}let box=$('#feedList');box.innerHTML=posts.length?posts.map(p=>postCard(p,profiles[p.profile_id]||null,false)).join(''):`<div class="empty">Ainda não há publicações no Blooming.</div>`}
async function boot(){if(!cfg()){config();return}if(!supabase()){config();return}let s=sess();if(s?.accountId){let r=await st.db.from('blooming_access').select('id,display_name').eq('id',s.accountId).maybeSingle();if(r.data){st.account=r.data;await loadProfiles();return}clear()}login()}
let sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';sc.onload=boot;sc.onerror=()=>app.innerHTML='<section class="card"><div class="brand">Blooming</div><p>Não foi possível carregar o Supabase.</p></section>';document.head.appendChild(sc)
})();</script></body></html>
