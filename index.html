async function xStatusMedia(url){
 const m=String(url||'').match(/(?:https?:\/\/)?(?:www\.)?(?:x|twitter|fxtwitter|vxtwitter)\.com\/([^\s/]+)\/status\/(\d+)/i);if(!m)return null;
 const user=m[1],id=m[2];
 try{
  const endpoints=[
   `https://api.fxtwitter.com/2/${encodeURIComponent(user)}/status/${id}`,
   `https://api.fxtwitter.com/${encodeURIComponent(user)}/status/${id}`,
   `https://api.fxtwitter.com/2/i/status/${id}`
  ];
  let j=null;
  for(const ep of endpoints){try{const r=await jget(ep,15000);const q=await r.json();if(q&&(q.status||q.tweet)){j=q;break}}catch(_){} }
  const st=j&&(j.status||j.tweet);if(!st)return null;
  const media=st.media||{};
  const out=[];
  for(const x of (Array.isArray(media.all)?media.all:[])){
   const typ=String(x?.type||'').toLowerCase();
   if(typ==='video'||typ==='gif'){
    const formats=Array.isArray(x.formats)?x.formats:[];
    const mp4s=formats.filter(f=>String(f?.container||'').toLowerCase()==='mp4'&&f?.url).sort((a,b)=>(+b.bitrate||0)-(+a.bitrate||0));
    const src=safeUrl(mp4s[0]?.url||x.url||x.transcode_url||'');
    if(src)out.push({type:'video',src,originalUrl:src,poster:safeUrl(x.thumbnail_url||x.thumbnail||''),sourceUrl:url});
   }else if(typ==='photo'){
    const src=safeUrl(x.url||x.src||'');if(src)out.push({type:'image',src,originalUrl:src,sourceUrl:url});
   }
  }
  if(!out.length)for(const x of (Array.isArray(media.videos)?media.videos:[])){
   const formats=Array.isArray(x.formats)?x.formats:[];
   const mp4s=formats.filter(f=>String(f?.container||'').toLowerCase()==='mp4'&&f?.url).sort((a,b)=>(+b.bitrate||0)-(+a.bitrate||0));
   const src=safeUrl(mp4s[0]?.url||x.url||x.transcode_url||'');
   if(src)out.push({type:'video',src,originalUrl:src,poster:safeUrl(x.thumbnail_url||''),sourceUrl:url});
  }
  if(!out.length&&media.external&&String(media.external.type||'').toLowerCase()==='video'){
   const src=safeUrl(media.external.url||'');if(src)out.push({type:'video',src,originalUrl:src,poster:safeUrl(media.external.thumbnail_url||''),sourceUrl:url});
  }
  if(!out.length)for(const x of (Array.isArray(media.photos)?media.photos:[])){
   const src=safeUrl(x.url||x.src||'');if(src)out.push({type:'image',src,originalUrl:src,sourceUrl:url});
  }
  return out;
 }catch(e){console.warn('xStatusMedia',e);return null}
}
function autoLinks(ta,items,render){
 if(!ta||!items)return;
 const ms=[...ta.value.matchAll(URL_RE)];if(!ms.length)return;
 const found=[...new Set(ms.map(m=>safeUrl(stripUrl(m[0]))).filter(Boolean))];
 let v=ta.value;ms.forEach(m=>{v=v.split(m[0]).join('')});
 ta.value=v.replace(/[ \t]{2,}/g,' ').replace(/^\s+/,'');
 found.forEach(url=>{
  if(items.some(x=>x.type==='link'&&x.url===url)||items.some(x=>x.sourceUrl===url))return;
  if(/(?:x|twitter)\.com\/[^\s/]+\/status\/\d+(?:\/video\/\d+)?/i.test(url)){
   const mark={type:'xstatus',sourceUrl:url,loading:true};items.push(mark);
   pendingLinks.push(xStatusMedia(url).then(ms=>{const i=items.indexOf(mark);if(i<0)return;if(ms&&ms.length){items.splice(i,1,...ms.map(x=>({...x,sourceUrl:url})))}else{items.splice(i,1,{type:'link',kind:'link',url,title:'Publicação do X',subtitle:'X / Twitter',art:'',loading:false})}}).catch(()=>{const i=items.indexOf(mark);if(i>=0)items[i]={type:'link',kind:'link',url,title:'Publicação do X',subtitle:'X / Twitter',art:'',loading:false}}).then(()=>render()));
   return;
  }
  const it={type:'link',kind:linkKind(url),url,title:'',subtitle:'',art:'',loading:true};
  items.push(it);
  pendingLinks.push(enrichLink(url).then(d=>{Object.assign(it,d,{loading:false})}).catch(()=>{it.loading=false}).then(()=>render()));
 });
 render();
}

function cropImageFile(file,dw,dh,cxPct,cyPct){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{try{const aspect=dw/dh;let sw=im.naturalWidth,sh=Math.round(sw/aspect);if(sh>im.naturalHeight){sh=im.naturalHeight;sw=Math.round(sh*aspect)}const maxX=Math.max(0,im.naturalWidth-sw),maxY=Math.max(0,im.naturalHeight-sh),sx=Math.round(maxX*cxPct/100),sy=Math.round(maxY*cyPct/100);const c=document.createElement('canvas');c.width=dw;c.height=dh;c.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,dw,dh);c.toBlob(b=>{URL.revokeObjectURL(url);if(b)resolve(new File([b],'sticker.webp',{type:'image/webp'}));else reject(new Error('Falha ao gerar a imagem'))},'image/webp',.88)}catch(e){URL.revokeObjectURL(url);reject(e)}};im.onerror=reject;im.src=url})}
function cropVideoFile(file,dw,dh,cxPct,cyPct,start,end){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=url;v.onloadedmetadata=()=>{const dur=v.duration||0,s=Math.min(Math.max(0,start),Math.max(0,dur-.05)),e=Math.min(Math.max(s+.1,end),dur||end);let sw=v.videoWidth,sh=v.videoHeight,aspect=dw/dh;if(sw/sh>aspect){sw=Math.round(sh*aspect)}else{sh=Math.round(sw/aspect)}const maxX=Math.max(0,v.videoWidth-sw),maxY=Math.max(0,v.videoHeight-sh),sx=Math.round(maxX*cxPct/100),sy=Math.round(maxY*cyPct/100);const c=document.createElement('canvas');c.width=dw;c.height=dh;const ctx=c.getContext('2d');const stream=c.captureStream?c.captureStream(30):null;if(!stream||!window.MediaRecorder){URL.revokeObjectURL(url);reject(new Error('Seu navegador não oferece gravação de vídeo no canvas.'));return}const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(x=>MediaRecorder.isTypeSupported(x))||'';if(!mime){URL.revokeObjectURL(url);reject(new Error('Seu navegador não consegue gerar a figurinha animada.'));return}const rec=new MediaRecorder(stream,{mimeType:mime});const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onerror=()=>reject(rec.error||new Error('Falha na gravação'));rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());URL.revokeObjectURL(url);resolve(new File(chunks,'sticker.webm',{type:mime.split(';')[0]}))};v.currentTime=s;v.onseeked=()=>{rec.start(200);const draw=()=>{if(v.paused||v.ended)return;ctx.drawImage(v,sx,sy,sw,sh,0,0,dw,dh);if(v.currentTime>=e){v.pause();setTimeout(()=>rec.stop(),120);return}requestAnimationFrame(draw)};v.play().then(draw).catch(err=>{try{rec.stop()}catch(_){}reject(err)})}};v.onerror=()=>reject(new Error('Não foi possível ler o vídeo'))})}
function hh(s){let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^a>>>16,2246822507)^Math.imul(b^b>>>13,3266489909);b=Math.imul(b^b>>>16,2246822507)^Math.imul(a^a>>>13,3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)}

function publicUsernameFromPath(){
 const raw=decodeURIComponent(location.pathname||'').replace(/^\/+|\/+$/g,'');
 if(!raw||location.hash)return '';

 // GitHub Pages project sites use /<repository>/ as the application base.
 // Do not mistake the repository name (e.g. "blooming") for a username.
 const parts=raw.split('/').filter(Boolean);
 let p=raw;
 if(location.hostname.endsWith('.github.io')){
   if(parts.length<=1)return '';
   p=parts.slice(1).join('/');
 }
 // Direct public profiles may be /repo/@username or /@username.
 if(p.includes('/')||p.startsWith('.')||/^(index\.html|favicon\.ico|robots\.txt|sitemap\.xml|_redirects)$/i.test(p))return '';
 return p.replace(/^@/,'').trim();
}

async function syncXProfile(uid,quiet=false,force=false){
 const u=U(uid);if(!u||!u.xSync||(!u.xSync.enabled&&!force)||!u.user)return {n:0,updated:0,dup:0,followersUpdated:false};
 try{
  const max=Math.max(1,Math.min(200,+u.xSync.max||50)),norm=await ixRemotePosts(u.user,max),known=new Set();
  let n=0,updated=0,dup=0,followersUpdated=false;
  // A sincronização também atualiza os números públicos do perfil no X.
  // Mantemos os valores anteriores se a API não devolver esses campos.
  try{
   const profile=await ixFromLink('@'+u.user),remote=profile&&profile.remote||{};
   if(remote.seg!=null && Number.isFinite(+remote.seg)){
    const v=Math.max(0,+remote.seg); if(+u.seg!==v){u.seg=v;followersUpdated=true;}
   }
   if(remote.sgd!=null && Number.isFinite(+remote.sgd)){
    const v=Math.max(0,+remote.sgd); if(+u.sgd!==v){u.sgd=v;followersUpdated=true;}
   }
  }catch(_){ /* publicações podem sincronizar mesmo se os números não estiverem disponíveis */ }

  S.posts.forEach(p=>{if(p.xSource&&p.xSource.platform==='x'&&String(p.xSource.account||'').toLowerCase()===String(u.user).toLowerCase())known.add(String(p.xSource.id))});
  for(const t of norm){
   const sid=String(t.id);let p=S.posts.find(x=>x.xSource&&x.xSource.platform==='x'&&String(x.xSource.id)===sid&&String(x.xSource.account||'').toLowerCase()===String(u.user).toLowerCase());
   if(p){
    if(!p.xSource.edited){
     const old=p.t,oldTs=p.ts;p.t=t.x;p.ts=t.ts;p.lk=t.lk;p.xSource.syncedAt=Date.now();
     if(old!==p.t||oldTs!==p.ts)updated++;
    } else p.xSource.syncedAt=Date.now();
    continue;
   }
   const src=xSourceUrl(u.user,sid);
   const alreadyByLink=S.posts.some(x=>x.xSource&&normXUrl(x.xSource.url)===normXUrl(src));
   if(alreadyByLink){dup++;continue}
   const mi=(t.rimg||[]).slice(0,4).map(url=>({type:'image',src:safeUrl(url)}));
   (t.videos||[]).slice(0,2).forEach(v=>{if(v.url)mi.push({type:'video',src:safeUrl(v.url),poster:safeUrl(v.poster||'')})});
   (t.links||[]).slice(0,3).forEach(url=>mi.push({type:'link',kind:linkKind(url),url,title:'',subtitle:'',art:''}));
   p={id:'x'+sid,u:uid,t:t.x,ts:t.ts,lk:t.lk,e:'',by:[],c:[],mediaItems:mi,media:mi.length===1?mi[0]:mi,poll:null,commentCount:+(t.commentCount||0)||0,xSource:{platform:'x',account:u.user,id:sid,url:src,edited:false,importedAt:Date.now(),syncedAt:Date.now()}};
   S.posts.push(p);n++;
  }
  u.xSync.lastSync=Date.now();u.xSync.lastError='';
  save();R();if(!quiet)alert(`Sincronização concluída: ${n} nova(s), ${updated} atualizada(s), ${dup} duplicada(s).${followersUpdated?' Seguidores/seguindo atualizados.':''}`);
  return {n,updated,dup,followersUpdated,followers:u.seg,following:u.sgd};
 }catch(e){u.xSync.lastError=String(e&&e.message||e);save();if(!quiet)alert('Não foi possível sincronizar agora. Verifique o @username e a conexão com o serviço do X.');return {n:0,updated:0,dup:0,followersUpdated:false,error:true}}
}

    $('#ixBody').innerHTML=`<h3>✅ Importação concluída</h3><p>${o.prof?'Perfil atualizado (@'+H(r.handle)+'). ':''}${o.posts?r.n+' publicações, '+r.nc+' comentários e '+r.imgs+' imagens.':'Nenhuma publicação foi importada.'}</p>${r.links?`<p class="mut">${r.links} links estão ganhando capa, título e artista em segundo plano.</p>`:''}${ex.length?`<p class="mut">Ficou de fora: ${ex.join('; ')}.</p>`:''}`;
    $('#ixBtns').innerHTML=`<button class="b g" data-m="x">Fechar</button><button class="b" data-m="ixview" data-u="${H(r.uid)}">Ver perfil</button>`;
   }catch(err){$('#ixBody').innerHTML='<p class="tg">Algo deu errado: '+H(err&&err.message||err)+'</p>';$('#ixBtns').innerHTML='<button class="b g" data-m="x">Fechar</button>'}
  }
 };
}
function mediaViewer(m){
 const src=safeUrl(m.src||m.url||'');if(!src)return;const isv=m.type==='video';md(`<div style="display:flex;justify-content:flex-end"><button class="b g sm" data-m="x" aria-label="Fechar">${IC.x}</button></div><div style="display:grid;place-items:center;max-height:78vh;overflow:auto">${isv?`<video controls autoplay loop playsinline ${m.poster?`poster="${H(m.poster)}"`:''} src="${H(src)}" style="width:100%;height:auto;max-height:76vh;object-fit:contain;border-radius:14px"></video>`:`<img src="${H(src)}" alt="Imagem ampliada" style="display:block;width:auto;max-width:100%;height:auto;max-height:76vh;border-radius:14px">`}</div><div class="cmtools" style="justify-content:center;margin-top:10px"><a class="b g sm" href="${H(src)}" download target="_blank">${IC.download} Baixar</a></div>`);$('#md').onclick=e=>{if(e.target.closest('[data-m="x"]'))$('#md').close()};}
async function sharePost(id){
 const p=S.posts.find(x=>x.id===id);if(!p)return;
 const u=U(p.u),url=location.protocol==='http:'||location.protocol==='https:'?location.href.split('#')[0]+'#/post/'+encodeURIComponent(id):'',text=`${u.nome} (@${u.user})\n${shownText(p)}`.trim();
 if(navigator.share){try{await navigator.share({title:'Blooming',text,url});return}catch(e){if(e&&e.name==='AbortError')return}}
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(url?`${text}\n${url}`:text);alert('Publicação copiada para a área de transferência.');return}}catch(_){}
 md(`<h2>Compartilhar publicação</h2><p class="mut">Copie o conteúdo abaixo. A página não será recarregada.</p><textarea class="fi" rows=6 readonly>${H(url?`${text}\n${url}`:text)}</textarea><div class="sd" style="padding:0"><button class="b g" data-m="x">Fechar</button><button class="b" data-m="copyShare">Copiar</button></div>`);
 $('#md').onclick=async e=>{const k=e.target.closest('[data-m]')?.dataset.m;if(k==='x'){$('#md').close();return}if(k==='copyShare'){try{await navigator.clipboard.writeText($('#md textarea').value);alert('Copiado!')}catch(_){$('#md textarea').focus();$('#md textarea').select()}}};
}
async function capturePost(id){
 const p=S.posts.find(x=>x.id===id);if(!p)return;const u=U(p.u),arr=mediaItemsOf(p),v=arr.find(x=>x.type==='video'),img=arr.find(x=>x.type==='image');
 if(v){const a=document.createElement('a');a.href=safeUrl(v.src)||'';a.download='blooming-'+id+'.mp4';a.target='_blank';a.click();return}
 const c=document.createElement('canvas');c.width=1200;c.height=700;const g=c.getContext('2d');g.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--bg')||'#f6f3fb';g.fillRect(0,0,c.width,c.height);g.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink')||'#1b1526';g.font='700 30px sans-serif';g.fillText('Blooming',70,70);g.font='700 24px sans-serif';g.fillText(String(u.nome||''),70,125);g.font='20px sans-serif';g.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--mut')||'#6b6280';g.fillText('@'+String(u.user||''),70,155);g.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink')||'#1b1526';const lines=String(p.t||'').slice(0,500).match(/.{1,62}(?:\s|$)/g)||[''];g.font='28px sans-serif';lines.slice(0,7).forEach((line,i)=>g.fillText(line.trim(),70,215+i*40));if(img&&img.src){try{const im=new Image();im.crossOrigin='anonymous';await new Promise((res,rej)=>{im.onload=res;im.onerror=rej;im.src=img.src});const scale=Math.min(1,1060/im.width,360/im.height);const w=im.width*scale,h=im.height*scale;g.drawImage(im,70,500,w,h)}catch(_){} }const blob=await new Promise(r=>c.toBlob(r,'image/png'));const file=new File([blob],'blooming-'+id+'.png',{type:'image/png'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({title:'Blooming',files:[file]});return}catch(_){} }const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='blooming-'+id+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);
}
document.addEventListener('click',e=>{const el=e.target.closest('.gallery .gi img,.gallery .gi video');if(!el)return;if(el.tagName==='VIDEO'&&e.target===el){const r=el.getBoundingClientRect();if(e.clientX>=r.right-80&&e.clientY>=r.bottom-60)return;}const gi=el.closest('.gi');const p=el.closest('[data-post]');if(!p)return;const post=S.posts.find(x=>x.id===p.dataset.post);const arr=mediaItemsOf(post);const all=[...gi.parentElement.querySelectorAll('.gi')];const idx=all.indexOf(gi);if(arr[idx])mediaViewer(arr[idx]);});
function repairBlooming(){try{localStorage.setItem('blooming-v1.backup_before_reset',localStorage.getItem('blooming-v1')||'');localStorage.removeItem('blooming-v1')}catch(_){}location.reload()}
addEventListener('hashchange',()=>{try{window.scrollTo(0,0);view()}catch(e){console.error(e)}});
// SESSÃO PERSISTENTE: atualizar/reabrir o HTML não desconecta a conta.
// Não salvamos a senha; apenas a conta/perfil que já foram autenticados neste navegador.
function restoreSession(){
  const aid=S.currentAccountId;
  if(!aid||!S.accounts[aid]){UNL=false;accessMode='';return false}
  accessMode=aid==='ana'?'ana':aid==='alana'?'alana':'normal';
  UNL=true;
  if(S.me && !U(S.me)){S.me=null;saveLocalOnly()}
  if(accessMode==='normal' && S.me && !profileBelongsToAccount(S.me,aid)){S.me=null;saveLocalOnly()}
  S.editMode=!!(S.me&&isAnaLauraProfile(U(S.me))&&aid==='ana'&&accessMode==='ana');
  return true;
}
restoreSession();
try{view();loadTombstones().then(()=>{try{purgeDeletedContent();view();if(CLOUD_ON)setTimeout(()=>cloudPull(),0)}catch(err){console.warn('tombstones startup',err)}});if(CLOUD_ON)setTimeout(()=>cloudPull(),300)}catch(e){console.error('Falha ao abrir Blooming:',e);const a=document.getElementById('app');if(a){a.innerHTML='<div class="lo"><h1 class="lg">Blooming</h1><p>Ocorreu um erro ao iniciar a interface.</p><p class="mut">Seus dados atuais foram preservados.</p><button class="b" onclick="repairBlooming()">Corrigir e abrir</button></div>'}}
/* Automação fica sob demanda para evitar bloqueio durante a abertura do HTML. */
setInterval(()=>{try{runAutomations()}catch(e){console.warn('Automação:',e)}},60000);
